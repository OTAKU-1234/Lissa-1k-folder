<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin — Lissa Entreprise</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="topbar">
    <a href="index.html" class="brand">
        LISSA <span class="tag">ADMIN</span>
    </a>

    <div class="nav-links">
        <a href="index.html">Accueil</a>
        <a href="list.html">Moun ki deja</a>
        <a href="admin.html" class="active">Admin</a>
    </div>
</div>


<div class="page">

    <!-- CONNEXION -->

    <div class="panel admin-panel" id="loginPanel">

        <div class="section-head">
            <div>
                <h2>Connexion Admin</h2>

                <div class="sub">
                    Accès réservé à l'administration de Lissa Entreprise.
                </div>
            </div>
        </div>


        <div id="loginMessage" class="alert"></div>


        <form id="loginForm">

            <div class="field">

                <label for="adminEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="adminEmail"
                    placeholder="admin@email.com"
                    required
                >

            </div>


            <div class="field">

                <label for="adminPassword">
                    Mot de passe
                </label>

                <input
                    type="password"
                    id="adminPassword"
                    placeholder="Votre mot de passe"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn btn-primary"
                id="loginButton"
            >
                Se connecter
            </button>

        </form>

    </div>



    <!-- TABLEAU ADMIN -->

    <div id="adminDashboard" style="display:none;">

        <div class="panel">

            <div class="section-head">

                <div>

                    <h2>Demandes d'inscription</h2>

                    <div class="sub">
                        Gérez les demandes reçues.
                    </div>

                </div>


                <button
                    class="btn btn-outline"
                    id="logoutButton"
                >
                    Déconnexion
                </button>

            </div>


            <div id="adminMessage" class="alert"></div>


            <div id="pendingList">

                Chargement...

            </div>

        </div>


        <div class="panel mt-24">

            <div class="section-head">

                <div>

                    <h2>Contacts approuvés</h2>

                    <div class="sub">
                        Contacts actuellement approuvés.
                    </div>

                </div>

            </div>


            <button
                class="btn btn-primary"
                id="downloadVcf"
            >
                Télécharger Lissa.vcf
            </button>

        </div>

    </div>

</div>



<footer>

    LISSA ENTREPRISE

    <div class="credit">
        Lissa 1K Folder — Mete statuw devan tout Moun
    </div>

</footer>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-client.js"></script>


<script>

const loginForm =
    document.getElementById("loginForm");

const loginPanel =
    document.getElementById("loginPanel");

const adminDashboard =
    document.getElementById("adminDashboard");

const loginMessage =
    document.getElementById("loginMessage");

const adminMessage =
    document.getElementById("adminMessage");

const pendingList =
    document.getElementById("pendingList");



/* =========================
   MESSAGE
========================= */

function showMessage(element, message, type = "error") {

    element.className =
        `alert alert-${type} show`;

    element.textContent =
        message;

}



/* =========================
   CONNEXION
========================= */

loginForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const email =
            document.getElementById("adminEmail")
            .value
            .trim();


        const password =
            document.getElementById("adminPassword")
            .value;


        const button =
            document.getElementById("loginButton");


        button.disabled = true;

        button.textContent =
            "Connexion...";


        const { data, error } =
            await supabaseClient.auth
            .signInWithPassword({
                email,
                password
            });


        button.disabled = false;

        button.textContent =
            "Se connecter";


        if (error) {

            console.error(error);

            showMessage(
                loginMessage,
                "Email ou mot de passe incorrect."
            );

            return;
        }


        loginPanel.style.display =
            "none";


        adminDashboard.style.display =
            "block";


        loadPendingRequests();

    }
);



/* =========================
   DEMANDES EN ATTENTE
========================= */

async function loadPendingRequests() {

    pendingList.innerHTML =
        "Chargement...";


    const { data, error } =
        await supabaseClient
        .from("registrations")
        .select("*")
        .eq("status", "pending")
        .order("created_at", {
            ascending: false
        });


    if (error) {

        console.error(error);

        pendingList.innerHTML =
            "<p>Impossible de charger les demandes.</p>";

        return;
    }


    if (!data || data.length === 0) {

        pendingList.innerHTML = `
            <div class="empty-members">
                Aucune demande en attente.
            </div>
        `;

        return;
    }


    pendingList.innerHTML = "";


    data.forEach(user => {

        const card =
            document.createElement("div");


        card.className =
            "panel";


        const date =
            new Date(user.created_at)
            .toLocaleString("fr-FR");


        card.innerHTML = `

            <h3>
                ${escapeHTML(user.name)}
            </h3>

            <p>
                <strong>WhatsApp :</strong>
                ${escapeHTML(user.phone)}
            </p>

            <p>
                <strong>Pays :</strong>
                ${escapeHTML(user.country || "")}
            </p>

            <p>
                <strong>Email :</strong>
                ${escapeHTML(user.email || "Non renseigné")}
            </p>

            <p>
                <strong>Inscrit le :</strong>
                ${date}
            </p>

            <div style="
                display:flex;
                gap:10px;
                flex-wrap:wrap;
                margin-top:15px;
            ">

                <button
                    class="btn btn-primary"
                    onclick="approveUser(${user.id})"
                >
                    Approuver
                </button>

                <button
                    class="btn btn-outline"
                    onclick="rejectUser(${user.id})"
                >
                    Refuser
                </button>

            </div>
        `;


        pendingList.appendChild(card);

    });

}



/* =========================
   APPROUVER
========================= */

async function approveUser(id) {

    const { error } =
        await supabaseClient
        .from("registrations")
        .update({
            status: "approved"
        })
        .eq("id", id);


    if (error) {

        console.error(error);

        showMessage(
            adminMessage,
            "Impossible d'approuver cette demande."
        );

        return;
    }


    showMessage(
        adminMessage,
        "Demande approuvée.",
        "success"
    );


    loadPendingRequests();

}



/* =========================
   REFUSER
========================= */

async function rejectUser(id) {

    const { error } =
        await supabaseClient
        .from("registrations")
        .update({
            status: "rejected"
        })
        .eq("id", id);


    if (error) {

        console.error(error);

        showMessage(
            adminMessage,
            "Impossible de refuser cette demande."
        );

        return;
    }


    showMessage(
        adminMessage,
        "Demande refusée.",
        "success"
    );


    loadPendingRequests();

}



/* =========================
   VCF
========================= */

document
.getElementById("downloadVcf")
.addEventListener(
    "click",
    downloadVCF
);


async function downloadVCF() {

    const { data, error } =
        await supabaseClient
        .from("registrations")
        .select("name, phone")
        .eq("status", "approved")
        .order("created_at", {
            ascending: true
        });


    if (error) {

        console.error(error);

        showMessage(
            adminMessage,
            "Impossible de récupérer les contacts."
        );

        return;
    }


    let vcf = "";


    data.forEach(contact => {

        const name =
            `LE ${contact.name}`;


        vcf +=
`BEGIN:VCARD
VERSION:3.0
FN:${escapeVCF(name)}
TEL;TYPE=CELL:${escapeVCF(contact.phone)}
END:VCARD
`;

    });


    const blob =
        new Blob(
            [vcf],
            {
                type: "text/vcard;charset=utf-8"
            }
        );


    const url =
        URL.createObjectURL(blob);


    const link =
        document.createElement("a");


    link.href = url;

    link.download =
        "Lissa.vcf";


    link.click();


    URL.revokeObjectURL(url);

}



/* =========================
   SECURITE TEXTE
========================= */

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text ?? "";

    return div.innerHTML;

}


function escapeVCF(text) {

    return String(text ?? "")
        .replace(/\\/g, "\\\\")
        .replace(/\n/g, "\\n")
        .replace(/;/g, "\\;")
        .replace(/,/g, "\\,");
}



/* =========================
   DECONNEXION
========================= */

document
.getElementById("logoutButton")
.addEventListener(
    "click",
    async function() {

        await supabaseClient.auth.signOut();

        adminDashboard.style.display =
            "none";

        loginPanel.style.display =
            "block";

        loginForm.reset();

    }
);

</script>

</body>
</html>
